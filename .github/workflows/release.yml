name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing x.y.z tag; dispatch this workflow from the same tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must be an existing x.y.z version without a v prefix."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Dispatch from the requested tag using --ref so provenance identifies the built source."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent
          release_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          while IFS= read -r existing_tag; do
            if [[ "$existing_tag" == "$RELEASE_TAG" ]]; then
              echo "::error::A release or draft already exists for this tag. It will not be overwritten."
              exit 1
            fi
          done <<< "$release_tags"

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build community plugin
        run: npm run build

      - name: Build full plugin
        run: npm run build:full

      - name: Run unit tests
        run: npm test

      - name: Check release files
        run: |
          set -euo pipefail
          npm run check:release -- "--tag=$RELEASE_TAG"
          npm run check:release -- --build=full "--tag=$RELEASE_TAG"

      - name: Prepare release notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line.startsWith(`## [${process.env.RELEASE_TAG}] - `));
          if (start < 0) throw new Error('The requested release needs a finalized changelog entry.');
          const next = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          const notes = lines.slice(start + 1, next < 0 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error('The requested changelog entry is empty.');
          writeFileSync(join(process.env.RUNNER_TEMP, 'patches-release-notes.md'), notes + '\n');
          NODE

      - name: Attest community release files
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/community/main.js
            dist/community/manifest.json
            dist/community/styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/community/main.js \
            dist/community/manifest.json \
            dist/community/styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Patches $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/patches-release-notes.md"

      - name: Verify uploaded draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const releaseId = execFileSync('gh', ['release', 'view', process.env.RELEASE_TAG, '--repo', process.env.GITHUB_REPOSITORY, '--json', 'databaseId', '--jq', '.databaseId'], { encoding: 'utf8' }).trim();
          const release = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/releases/${releaseId}`], { encoding: 'utf8' }));
          const expected = ['main.js', 'manifest.json', 'styles.css'];
          if (!release.draft || release.tag_name !== process.env.RELEASE_TAG) throw new Error('Expected an unpublished draft for the requested tag.');
          if (JSON.stringify(release.assets.map(asset => asset.name).sort()) !== JSON.stringify(expected.sort())) throw new Error('Unexpected release attachments.');
          for (const asset of release.assets) {
            const bytes = readFileSync(`dist/community/${asset.name}`);
            const digest = 'sha256:' + createHash('sha256').update(bytes).digest('hex');
            if (asset.state !== 'uploaded' || asset.size !== bytes.length || asset.digest !== digest) throw new Error(`Uploaded file differs from the attested build: ${asset.name}`);
          }
          console.log(`Draft ready for review: ${release.html_url}`);
          NODE
