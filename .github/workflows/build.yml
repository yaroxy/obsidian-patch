name: Build

on:
  push:
    branches:
      - codex/full
  pull_request:
    branches:
      - codex/full

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Full plugin
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Check Full installation files
        run: npm run check:release
